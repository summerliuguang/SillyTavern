# SillyTavern 局域网反代
# 按实际情况修改:对外端口、server_name(本机内网 IP)、证书名
# 注意:ST 走 socket.io(WebSocket)且 AI 回复为流式,Upgrade 头与 proxy_buffering off 都不能省

map $http_upgrade $st_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 29009 ssl;
    server_name _;

    # 明文 http 打到 ssl 端口时自动 301 到 https(导航页链接是 http://)
    error_page 497 =301 https://$host:$server_port$request_uri;

    ssl_certificate /etc/nginx/ssl/sillytavern.crt;
    ssl_certificate_key /etc/nginx/ssl/sillytavern.key;

    # 角色卡(PNG)与背景图上传
    client_max_body_size 20M;

    # 家庭统一登录(SSO):未登录自动跳登录页(socket.io 升级请求同样先过 SSO)
    include /etc/nginx/snippets/sso-auth.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # socket.io WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $st_connection_upgrade;
        # SSE/流式响应必须关缓冲,否则流式内容攒到结束才吐
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
    }
}
